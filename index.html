<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6fed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="本地优先的课程资料整理工具：自动归类、版本管理、全文检索、一键打包" />
  <title>课程资料库</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-ico">📚</span>
        <span class="brand-name">课程资料库</span>
      </div>

      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input id="search" class="search-input" type="search" placeholder="搜索文件名，或课件里的内容…" autocomplete="off" />
        <button id="search-clear" class="search-clear hidden" aria-label="清空">×</button>
      </div>

      <div class="topbar-actions">
        <span id="extract-status" class="extract-status hidden"></span>
        <button id="btn-import" class="primary-btn">＋ 导入文件</button>
        <button id="btn-settings" class="icon-btn" aria-label="设置">⚙️</button>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <!-- 文件选择：普通选文件 / 选整个文件夹（Chromium 系支持目录选择） -->
  <input type="file" id="file-input" multiple hidden />
  <input type="file" id="dir-input" webkitdirectory directory multiple hidden />

  <script src="vendor/jszip.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
